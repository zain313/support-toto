name: Check generated pages

# Fails when someone edits _src/ without rebuilding, or edits a generated page directly.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - run: node _src/build.mjs --check
